services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: glint
      POSTGRES_PASSWORD: glint
      POSTGRES_DB: glint
    ports: ["5432:5432"]
    volumes:
      - ./migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glint"]
      interval: 2s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgres://glint:glint@db:5432/glint?sslmode=disable
      LICENCE_SIGNING_KEY: dev-only-key
      PLAY_PACKAGE_NAME: app.glint
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
